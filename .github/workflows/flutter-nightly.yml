name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      ios-only:
        description: "Build only the unsigned iOS IPA"
        required: false
        default: false
        type: boolean

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      ios-only: ${{ github.event_name == 'workflow_dispatch' && inputs.ios-only }}
